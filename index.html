<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Surprise...</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background-color: #fff0f3;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        /* Intro Screen */
        #intro-screen {
            z-index: 20;
        }

        .unlock-btn {
            background: #ff477e;
            color: white;
            border: none;
            padding: 20px;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 71, 126, 0.4);
            animation: pulse 1.5s infinite;
        }

        /* Main Card (Hidden initially) */
        .card {
            display: none;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 71, 126, 0.2);
            max-width: 350px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 1s;
        }

        h1 { color: #ff477e; }
        .details {
            background: #fff8f9;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px dashed #ff477e;
            font-size: 0.95rem;
        }

        .btn {
            background: #ff477e;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            display: inline-block;
            font-weight: bold;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart {
            position: absolute;
            color: #ffb3c1;
            font-size: 20px;
            animation: float 6s linear infinite;
            bottom: -20px;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <p style="color: #ff477e; font-weight: bold;">Tap the heart to open your surprise!</p>
        <button class="unlock-btn" onclick="unlock()">❤️</button>
    </div>

    <div class="card" id="main-card">
        <span>💌</span>
        <h1>Will you be my Valentine?</h1>
        <p>I'd love to spend the day with you!</p>
        
        <div class="details">
            <strong>The Plan:</strong> We will be together going there!<br>
            <strong>Where:</strong> Ayala Malls Manila Bay<br>
            <strong>When:</strong> February 14, 2026
        </div>

        <a href="https://wa.me/?text=Yes!%20I%20can't%20wait!" class="btn">YES, OF COURSE!</a>
    </div>

    <script>
        function unlock() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('main-card').style.display = 'block';
            // Start hearts after clicking
            setInterval(createHeart, 400);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
    </script>
</body>
</html>
